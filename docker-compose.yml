services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: overboard-organizer:latest
    container_name: overboard-organizer
    restart: unless-stopped

    # Bound to localhost so only the host's Caddy can reach it.
    # Port 10946 was chosen to avoid collisions with other locally-hosted
    # projects on this machine. Caddy snippet (on the host):
    #
    #   overboard.example.com {
    #       reverse_proxy 127.0.0.1:10946
    #   }
    ports:
      - "127.0.0.1:10946:3000"

    # SQLite lives on the host so the DB survives image rebuilds.
    # Created on first `docker compose up`; back up by copying ./data/app.db.
    volumes:
      - ./data:/app/data

    # Mail settings come from a `.env` next to this file, which Compose
    # substitutes into the `${...}` values below. `.gitignore` already covers
    # `.env*`, so the key never enters the tree. Leaving them unset is a legal
    # state: with no RESEND_API_KEY the password reset flow still works from the
    # user's side and delivers nothing, and the server log says so each time.
    #
    # This is the Docker path only. The deployed instance is built by jkbase
    # from a git push and gets its secrets platform-side via
    # `jkbase secret set KEY=value` — none of that is configured here.
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/app/data/app.db
      APP_BASE_URL: ${APP_BASE_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
